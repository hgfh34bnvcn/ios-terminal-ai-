name: TermAI
options:
  bundleIdPrefix: io.github.hgfh34bnvcn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TermKit:
    path: TermKit
targets:
  TermAI:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: TermKit
        product: TermCore
      - package: TermKit
        product: TermSSH
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TermAI
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Agent-written files show up in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Connects to API endpoints and SSH hosts on your local network.
        # Endpoints are user-configured and may be plain-http servers on a LAN or VPN (e.g. Ollama).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hgfh34bnvcn.termai
        PRODUCT_NAME: TermAI
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
